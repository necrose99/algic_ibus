name: Bake Generic Linux Tarball Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers production deployment whenever a release tag (e.g., v1.2.0) is pushed
  workflow_dispatch:

jobs:
  build_release:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Install Alpine Build Dependencies
        run: |
          apk update
          apk add --no-cache ibus ibus-table bash tar gzip python3

      - name: Verify Matrix Table Structure
        run: |
          # Ensure rows within the BEGIN_TABLE block contain true tabs, not space padding
          if grep -E '^[^#].* ' algic_keys.txt | grep -qV 'BEGIN_TABLE\|END_TABLE'; then
            echo "❌ Error: Space character detected in table entry row. Columns must be separated by literal tabs!"
            exit 1
          fi
          echo "✅ Matrix layout syntax looks sound."

      - name: Compile and Structure Split Release Architecture
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # 1. Use the build pipeline engine to split and compile modules
          VERSION="${VERSION:-2026.11.08}" bash build.sh
          
          # 2. Build the distribution package tree structure
          STAGING_DIR="algic_ibus-linux-generic"
          mkdir -p "$STAGING_DIR/tables"
          mkdir -p "$STAGING_DIR/inputrc"
          mkdir -p "$STAGING_DIR/profile.d"
          
          # 3. Collect compiled dialect sub-modules from build_out
          cp build_out/*.db "$STAGING_DIR/tables/"
          cp build_out/inputrc.* "$STAGING_DIR/inputrc/"
          cp packaging/profile.d/algic.sh "$STAGING_DIR/profile.d/"
          cp Readme.md "$STAGING_DIR/"
          
          # 4. Inject a decoupled modular installer engine into the tarball
          cat << 'EOF' > "$STAGING_DIR/install.sh"
          #!/usr/bin/env bash
          set -e

          echo "========================================================================"
          echo " ⌨ Installing Algic Split Keyboard Layouts & Dynamic Terminal Engines"
          echo "========================================================================"

          # --- 1. Detect Privileges & Map System Targets ---
          if [ "$EUID" -eq 0 ]; then
              TABLE_DEST="/usr/share/ibus-table/tables"
              INPUTRC_DEST="/usr/share/algic-ibus/inputrc"
              PROFILE_DEST="/etc/profile.d"
              echo "[*] Running as root. Provisioning system-wide multitenant layers..."
          else
              TABLE_DEST="$HOME/.local/share/ibus-table/tables"
              INPUTRC_DEST="$HOME/.local/share/algic-ibus/inputrc"
              PROFILE_DEST="$HOME/.profile.d-local-fallback" # Warn user for profile inclusion
              echo "[*] Running as standard user. Provisioning local sandbox paths..."
          fi

          # --- 2. Deploy Isolated Graphical IBus Tables ---
          echo "[*] Staging compiled graphical layout models..."
          mkdir -p "$TABLE_DEST"
          cp tables/*.db "$TABLE_DEST/"
          chmod 644 "$TABLE_DEST"/*.db

          # --- 3. Deploy Isolated GNU Readline Terminal Profiles ---
          echo "[*] Staging isolated shell keyboard profiles..."
          mkdir -p "$INPUTRC_DEST"
          cp inputrc/inputrc.* "$INPUTRC_DEST/"
          chmod 644 "$INPUTRC_DEST"/*

          # --- 4. Deploy Transient Runtime Environment Hook ---
          echo "[*] Initializing automated terminal startup hooks..."
          if [ "$EUID" -eq 0 ]; then
              mkdir -p "$PROFILE_DEST"
              cp profile.d/algic.sh "$PROFILE_DEST/"
              chmod 755 "$PROFILE_DEST/algic.sh"
              echo "[+] Global profile hook seeded inside /etc/profile.d/algic.sh"
          else
              # If non-root, give the user programmatic instructions to hook their shell
              mkdir -p "$PROFILE_DEST"
              cp profile.d/algic.sh "$PROFILE_DEST/"
              chmod 755 "$PROFILE_DEST/algic.sh"
              
              echo "[!] Note: To load layouts automatically on shell initialization, add this line to your ~/.bashrc or ~/.zshrc:"
              echo "    source $PROFILE_DEST/algic.sh"
          fi

          # --- 5. Recycle Environment Daemon Pipelines ---
          echo "[*] Flushing background IBus runtime cache contexts..."
          if command -v ibus >/dev/null 2>&1; then
              ibus exit || true
              rm -f "$HOME/.cache/ibus/bus/*"
              ibus-daemon -drx
              echo "✅ Success! Navigate to Desktop Keyboard Settings and add your focused dialect."
          else
              echo "⚠️ Warning: 'ibus' environment tool not found. Cycle your graphical interface engine manually."
          fi
          EOF

          # Finalize packaging permissions and compress payload
          chmod +x "$STAGING_DIR/install.sh"
          tar -czf algic_ibus-linux-generic.tar.gz "$STAGING_DIR"
          
          mkdir -p dist
          mv algic_ibus-linux-generic.tar.gz dist/

      - name: Upload Local Generic Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: algic-linux-generic-release
          path: dist/algic_ibus-linux-generic.tar.gz

  deploy_release:
    needs: build_release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Strictly limits production releases to explicit tags
    steps:
      - name: Download Built Generic Tarball Asset
        uses: actions/download-artifact@v4
        with:
          name: algic-linux-generic-release
          path: dist/

      - name: Broadcast Automated GitHub Production Release Tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dist/algic_ibus-linux-generic.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
